<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Smooth subtle drop shadow for depth on light backgrounds -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f243e" flood-opacity="0.08" />
    </filter>
    <linearGradient id="bagGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7527" />
      <stop offset="100%" stop-color="#E8590C" />
    </linearGradient>
    <linearGradient id="handleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A436E" />
      <stop offset="100%" stop-color="#102A47" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A436E" />
      <stop offset="100%" stop-color="#0F243E" />
    </linearGradient>
  </defs>

  <!-- Crisp Rounded White Card Badge (works on both dark and light browser tabs) -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#FFFFFF" filter="url(#badgeShadow)" />
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- SparkoMart Icon Mark: Centered & Optimized -->
  <g id="sparkomart-mark" transform="translate(64, 66) scale(1.18) translate(-64, -58)">
    <!-- Blue Curved Handle -->
    <path
      d="M54 34 V22 C54 15.5 58.5 11 64 11 C69.5 11 74 15.5 74 22 V34"
      fill="none"
      stroke="url(#handleGradient)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Vibrant Orange Shopping Bag with Notch -->
    <path
      d="
        M 42 34
        H 86
        C 92 34, 95.5 37.5, 95.5 43.5
        V 83.5
        C 95.5 89, 92 92.5, 86 92.5
        H 71.5
        C 66 92.5, 63 89, 63 83.5
        V 68
        C 63 60, 56.5 56, 49 59.5
        C 41 63.5, 33 59, 33 51.5
        V 43.5
        C 33 37.5, 36.5 34, 42 34
        Z
      "
      fill="url(#bagGradient)"
    />

    <!-- Dynamic Cursor Arrow pointing UP-RIGHT (↗) -->
    <path
      d="
        M 58 64.5
        C 60 66.5, 60 69, 58 70.8
        L 50 89.8
        C 48.8 92.2, 45.8 92.5, 44.2 90.5
        L 42.8 80
        L 32 78.5
        C 29.8 78, 29 75.2, 30.8 73.4
        L 52.6 62
        C 54.4 61, 56.5 62, 58 64.5
        Z
      "
      fill="url(#arrowGradient)"
    />
  </g>
</svg>
