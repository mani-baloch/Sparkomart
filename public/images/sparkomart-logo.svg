<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- White Card Background -->
  <rect x="2" y="2" width="116" height="116" rx="20" fill="#FFFFFF" />

  <!-- Blue Curved Handle -->
  <path
    d="M 50 28 V 20 C 50 14.5 54.5 10 60 10 C 65.5 10 70 14.5 70 20 V 28"
    stroke="#163A63"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Orange Shopping Bag with Notch -->
  <path
    d="
      M 39 28
      H 81
      C 87 28, 90 31, 90 37
      V 71
      C 90 77, 87 80, 81 80
      H 68
      C 63 80, 60 77, 60 72
      V 56
      C 60 48, 54 44, 46 44
      H 39
      C 33 44, 30 41, 30 35
      V 37
      C 30 31, 33 28, 39 28
      Z
    "
    fill="#F16722"
  />

  <!-- Dark Navy Blue Cursor Arrow -->
  <path
    d="
      M 56 46
      C 57.5 47.5, 57.5 49.5, 56 51
      L 38 69
      C 36.5 70.5, 34 69.5, 34.5 67.5
      L 37.5 59
      L 29 56
      C 27 55.5, 26 53, 27.5 51.5
      L 45 34
      C 46.5 32.5, 48.5 32.5, 50 34
      Z
    "
    fill="#163A63"
  />

  <!-- SparkoMart Text -->
  <text x="60" y="103" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="16.5" letter-spacing="-0.4">
    <tspan fill="#F16722">Sparko</tspan><tspan fill="#163A63">Mart</tspan>
  </text>
</svg>
